<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Pizza Napoli</title>
  </head>
  <body>
    <header>
      <div id="nav-bar">
        <img id="logo-pizza" src="logo-pizzeria.png" alt="" />
        <form id="search-form">
          <label for="search-input">CERCA</label>
          <input type="text" id="search-input" size="30" />
        </form>
        <span id="slogan">Dal 1990 l'autentica pizza napoletana!</span>
        <nav id="list-bar">
          <a href="#" id="home">HOME</a>
          <a href="#" id="chi-siamo">CHI SIAMO</a>
          <a href="#" id="contatti">CONTATTI</a>
        </nav>
      </div>
    </header>
    <main>
      <div>
        <h1>Gusta la vera pizza napoletana a casa tua</h1>
        <ul id="menu-pizze">
          <li>
            <img src="pizza-margherita.jpg" alt="pizza margherita" />
            <h3>Pizza Margherita</h3>
            <p class="prezzo">€ 7.50</p>
            <button class="btn-carrello">Aggiungi</button>
          </li>
          <li>
            <img src="pizza-diavola.png" alt="pizza diavola" />
            <h3>Pizza Diavola</h3>
            <p class="prezzo">€ 8.50</p>
            <button class="btn-carrello">Aggiungi</button>
          </li>
          <li>
            <img src="pizza-valtellina.jpg" alt="pizza valtellina" />
            <h3>Pizza Valtellina</h3>
            <p class="prezzo">€ 9.50</p>
            <button class="btn-carrello">Aggiungi</button>
          </li>
        </ul>
      </div>
    </main>
    <footer>
      <div id="footer-content">
        <p>&copy; 2026 Pizzeria Napoletana - Tutti i diritti riservati</p>
        <div id="social-links">
          <a href="#" class="social-item">
            <img src="logo-facebook.png" alt="Facebook" />
            <span>Facebook</span>
          </a>
          <a href="#" class="social-item">
            <img src="logo-instagram.png" alt="Instagram" />
            <span>Instagram</span>
          </a>
          <a href="#" class="social-item">
            <img src="logo-tiktok.png" alt="TikTok" />
            <span>TikTok</span>
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
